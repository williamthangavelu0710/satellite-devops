apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-management-api
  labels:
    app: satellite-management-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: satellite-management-api

  template:
    metadata:
      labels:
        app: satellite-management-api

    spec:
      containers:
        - name: management-api
          image: satellite-management-api:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
