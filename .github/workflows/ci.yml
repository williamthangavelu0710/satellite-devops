
name: Satellite Management API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install -r app/management-api/requirements-dev.txt

      - name: Run Python Tests
        run: |
          python -m pytest app/management-api/test_main.py -v

      - name: Build Docker Image
        run: |
          docker build \
            -t satellite-management-api:ci \
            ./app/management-api

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Tag and Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag satellite-management-api:ci \
            ghcr.io/williamthangavelu0710/satellite-management-api:${{ github.sha }}

          docker push \
            ghcr.io/williamthangavelu0710/satellite-management-api:${{ github.sha }}